<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Flavour Heaven</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#0a0a0a;
  color:white;
}

/* SECTION */
section{
  padding:50px 20px;
  margin:10px 0;
  text-align:center;
}

/* HERO IMAGE (YOUR PHOTO) */
.hero{
  position:relative;
}

.hero img{
  width:100%;
  max-width:400px;
  border-radius:20px;
  filter:brightness(0.7);
}

.hero-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.hero-text h1{
  font-size:28px;
  font-weight:800;
}

.hero-text p{
  font-size:14px;
  opacity:0.8;
}

/* TAGLINE */
.tagline{
  font-size:28px;
  font-weight:700;
  color:#ffcc00;
}

/* MENU */
.menu p{
  font-size:18px;
  margin:6px 0;
}

/* DETAILS */
.details{
  margin-top:20px;
  line-height:1.6;
}

/* CTA */
.cta{
  margin-top:20px;
  font-size:24px;
  font-weight:700;
  color:#ff5733;
}

/* FOOTER */
.footer{
  margin-top:30px;
  font-size:15px;
  opacity:0.8;
}
</style>
</head>

<body>

<!-- HERO WITH YOUR IMAGE -->
<section class="hero">
  <img src="your-image.jpg" alt="Owner Image">

  <div class="hero-text">
    <h1>THE FLAVOUR HEAVEN</h1>
    <p>Street Food • Fries • Momos • Mastani</p>
  </div>
</section>

<!-- TAGLINE -->
<section>
  <div class="tagline">HOT • FRESH • LOADED</div>
</section>

<!-- MENU -->
<section>
  <div class="menu">
    <p>🍟 Loaded Fries</p>
    <p>🥟 Fried Momos</p>
    <p>🥭 Mango Mastani</p>
    <p>🧀 Cheese Specials</p>
    <p>🔥 Crispy Snacks</p>
  </div>
</section>

<!-- DETAILS -->
<section>
  <div class="details">
    📍 Exhibition 2026<br>
    📅 7 May – 10 May<br>
    🎪 Stall No. 4
  </div>

  <div class="cta">VISIT US TODAY</div>
</section>

<!-- CONTACT -->
<section>
  <div class="footer">
    📞 8485806065<br>
    📸 @theflavourheaven
  </div>
</section>

</body>
</html>
